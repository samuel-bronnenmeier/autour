name: Publish

permissions:
    contents: write

on:
    workflow_dispatch:

jobs:
    publish:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 20
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - run: npm install
            - run: npm run publish
