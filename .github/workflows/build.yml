name: Publish

permissions:
    contents: write

on:
    workflow_dispatch:

jobs:
    publish:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm
            - run: npm install
            - run: npm run publish
              env:
                  GITHUB_TOKEN: ${{ secrets.OTHER_GITHUB_TOKEN }}
